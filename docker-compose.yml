services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./facilityos.db}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  # Production database — swap DATABASE_URL to postgresql+asyncpg://facilityos:facilityos@db:5432/facilityos
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: facilityos
  #     POSTGRES_PASSWORD: facilityos
  #     POSTGRES_DB: facilityos
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  backend-data:
  # pgdata:
